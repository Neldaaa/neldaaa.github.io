<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HNSCC Current Progress Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1f2937;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #586069;
    --red: #f85149;
    --red-dim: #3d1a1a;
    --amber: #d29922;
    --amber-dim: #2d2208;
    --green: #3fb950;
    --green-dim: #0f2d1a;
    --blue: #58a6ff;
    --blue-dim: #0d2137;
    --cyan: #39d0d8;
    --purple: #bc8cff;
    --pink: #ff7eb6;
    --accent: #1f6feb;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans', sans-serif; font-size:14px; min-height:100vh; display: flex; flex-direction: column; }
  
  /* HEADER */
  .header {
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title { display:flex; align-items:center; gap:12px; }
  .header-badge {
    background: var(--accent); color:#fff; font-size:10px; font-weight:700;
    padding:3px 8px; border-radius:4px; letter-spacing:1px; font-family:'DM Mono',monospace;
  }
  .header h1 { font-size:18px; font-weight:600; letter-spacing:-0.3px; }
  .header-sub { color:var(--text-muted); font-size:12px; font-family:'DM Mono',monospace; }
  .live-dot { width:8px; height:8px; border-radius:50%; background:var(--green); 
    animation: pulse 2s infinite; display:inline-block; margin-right:6px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* MAIN PANEL */
  .main { display:flex; flex-direction:column; flex: 1; overflow:hidden; }
  
  /* STATS BAR */
  .stats-bar {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:12px 20px; display:flex; gap:20px; align-items:center; justify-content: center;
  }
  .stat-item { text-align:center; }
  .stat-num { font-size:22px; font-weight:700; font-family:'DM Mono',monospace; line-height:1; }
  .stat-label { font-size:10px; color:var(--text-muted); margin-top:2px; letter-spacing:.5px; text-transform:uppercase; }
  .stat-divider { width:1px; height:32px; background:var(--border); }

  /* PATIENT DETAIL */
  .patient-detail { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
  
  .detail-header {
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:16px 20px; display:flex; align-items:center; gap:20px;
  }
  .detail-pid { font-family:'DM Mono',monospace; font-size:16px; font-weight:500; color:var(--blue); }
  
  .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  
  /* CARDS */
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:16px;
  }
  .card-title { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:12px; font-weight:600; }

  /* RISK GAUGE */
  .risk-gauge-wrap { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .gauge-svg { width:160px; height:90px; }
  .risk-percent { font-size:40px; font-weight:700; font-family:'DM Mono',monospace; line-height:1; }
  .risk-label { font-size:13px; font-weight:600; margin-top:4px; }
  .risk-recommendation { font-size:11px; color:var(--text-muted); margin-top:4px; font-style:italic; text-align:center; }
  
  /* SHAP CHART */
  .shap-bars { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .shap-row { display:flex; align-items:center; gap:8px; }
  .shap-label { width:130px; font-size:11px; font-family:'DM Mono',monospace; color:var(--text-muted); flex-shrink:0; text-align:right; }
  .shap-bar-wrap { flex:1; height:20px; position:relative; display:flex; align-items:center; }
  .shap-zero { position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--border); }
  .shap-bar {
    position:absolute; height:14px; border-radius:2px; transition:width .4s ease;
  }
  .shap-bar.pos { background:var(--cyan); left:50%; }
  .shap-bar.neg { background:var(--pink); right:50%; }
  .shap-val { font-size:10px; font-family:'DM Mono',monospace; color:var(--text-dim); width:44px; flex-shrink:0; text-align:right; }

  .shap-legend { display:flex; gap:12px; margin-bottom:8px; flex-wrap:wrap; justify-content: center; }
  .legend-item { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--text-muted); }
  .legend-dot { width:8px; height:8px; border-radius:2px; }

  .tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-family:'DM Mono',monospace; }
  
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation: fadeIn .25s ease; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <span class="header-badge">HNSCC</span>
    <h1>Current Progress: Clinical Decision Support</h1>
  </div>
  <div class="header-sub"><span class="live-dot"></span>Recurrence Risk Prediction System &mdash; v2.1</div>
</div>

<div class="main">
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-num" style="color:var(--text)" id="st-total">692</div>
      <div class="stat-label">Total Patients</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <div class="stat-num" style="color:var(--red)" id="st-high">56</div>
      <div class="stat-label">High Risk (&ge;70%)</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <div class="stat-num" style="color:var(--amber)" id="st-med">599</div>
      <div class="stat-label">Medium Risk</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <div class="stat-num" style="color:var(--green)" id="st-low">37</div>
      <div class="stat-label">Low Risk</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <div class="stat-num" style="color:var(--purple)" id="st-recur">160</div>
      <div class="stat-label">Recurrence+</div>
    </div>
  </div>

  <div class="patient-detail" id="patientDetail"></div>
</div>

<script>
const PATIENT_DATA = {"id":"PT-2024-625","recurrence":"yes","risk":82.8,"nlr":10.11,"plr":357.83,"lmr":1.05,"age":69,"sex":0,"tstage":"TX","grading":1,"hpv":1,"ln_pos":14,"shap":{"nlr":{"value":10.11,"high":true,"contrib":0.171},"plr":{"value":357.83,"high":true,"contrib":0.068},"lmr":{"value":1.05,"high":false,"contrib":0.019},"age":{"value":69,"young":false,"contrib":-0.008},"tstage":{"value":"TX","contrib":0.064}}};

function getRiskColor(r) { return r >= 70 ? 'var(--red)' : r >= 40 ? 'var(--amber)' : 'var(--green)'; }
function getRiskLabel(r) { return r >= 70 ? 'High Risk' : r >= 40 ? 'Medium Risk' : 'Low Risk'; }
function getRiskRec(r) {
  if(r >= 70) return '⚠️ Intensive follow-up recommended.';
  if(r >= 40) return '📋 Standard monitoring protocol.';
  return '✅ Routine follow-up sufficient.';
}

function buildGaugeSVG(risk) {
  const r = 70, cx = 80, cy = 80;
  const startAngle = Math.PI;
  const endAngle = Math.PI + (risk / 100) * Math.PI;
  const x2 = cx + r * Math.cos(endAngle);
  const y2 = cy + r * Math.sin(endAngle);
  const color = risk >= 70 ? '#f85149' : risk >= 40 ? '#d29922' : '#3fb950';
  const bg = risk >= 70 ? '#3d1a1a' : risk >= 40 ? '#2d2208' : '#0f2d1a';
  return `<svg viewBox="0 0 160 90" xmlns="http://www.w3.org/2000/svg" class="gauge-svg">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${bg}" stroke-width="10" stroke-linecap="round"/>
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"/>
  </svg>`;
}

function buildShapBars(p) {
  const s = p.shap;
  const rows = [
    { label: `NLR (${s.nlr.high?'High':'Normal'})`, contrib: s.nlr.contrib, color: 'var(--cyan)' },
    { label: `T-Stage (${s.tstage.value})`, contrib: s.tstage.contrib, color: 'var(--blue)' },
    { label: `PLR (${s.plr.high?'High':'Normal'})`, contrib: s.plr.contrib, color: '#7ec8e3' },
    { label: `Age (${s.age.young?'Younger':'Older'})`, contrib: s.age.contrib, color: 'var(--purple)' },
    { label: `LMR (${s.lmr.high?'High':'Normal'})`, contrib: s.lmr.contrib, color: 'var(--pink)' },
  ];
  const maxAbs = Math.max(...rows.map(r => Math.abs(r.contrib)), 0.01);
  const scale = 45 / maxAbs;
  
  return `
    <div class="shap-legend">
      ${rows.map(r => `<span class="legend-item"><span class="legend-dot" style="background:${r.color}"></span>${r.label}</span>`).join('')}
    </div>
    <div class="shap-bars">
      ${rows.map(r => {
        const pct = Math.abs(r.contrib) * scale;
        const isPos = r.contrib >= 0;
        return `<div class="shap-row">
          <div class="shap-label">${r.label}</div>
          <div class="shap-bar-wrap">
            <div class="shap-zero"></div>
            <div class="shap-bar ${isPos?'pos':'neg'}" style="width:${pct}%; background:${r.color}"></div>
          </div>
          <div class="shap-val">${r.contrib > 0 ? '+' : ''}${r.contrib.toFixed(3)}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-dim);font-family:'DM Mono',monospace;margin-top:4px;padding:0 130px 0 0">
      <span>← Risk Reduction</span><span>Risk Increase →</span>
    </div>`;
}

function renderPatient(p) {
  const color = getRiskColor(p.risk);
  const label = getRiskLabel(p.risk);
  const rec = getRiskRec(p.risk);
  const sexLabel = p.sex === 0 ? 'Male' : 'Female';
  const hpvLabel = p.hpv === 1 ? 'Positive' : p.hpv === 0 ? 'Negative' : 'Unknown';
  
  document.getElementById('patientDetail').innerHTML = `
    <div class="fade-in">
      <div class="detail-header">
        <div>
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px">Patient ID</div>
          <div class="detail-pid">${p.id}</div>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
          <span class="tag" style="background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)">${sexLabel}</span>
          <span class="tag" style="background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)">HPV ${hpvLabel}</span>
          <span class="tag" style="background:${p.recurrence==='yes'?'var(--red-dim)':'var(--green-dim)'};color:${p.recurrence==='yes'?'var(--red)':'var(--green)'};border:1px solid ${p.recurrence==='yes'?'#5a1d1d':'#0d3d1a'}">
            ${p.recurrence === 'yes' ? '⚠ Recurrence Confirmed' : '✓ No Recurrence'}
          </span>
        </div>
      </div>

      <div class="detail-grid">
        <div class="card">
          <div class="card-title">Recurrence Risk Assessment</div>
          <div class="risk-gauge-wrap">
            ${buildGaugeSVG(p.risk)}
            <div class="risk-percent" style="color:${color}">${p.risk}%</div>
            <div class="risk-label" style="color:${color}">${label}</div>
            <div class="risk-recommendation">${rec}</div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">SHAP Risk Attribution (Individual Level)</div>
          ${buildShapBars(p)}
        </div>
      </div>
    </div>`;
}

renderPatient(PATIENT_DATA);
</script>
</body>
</html>
