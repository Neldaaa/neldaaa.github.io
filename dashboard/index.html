<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HNSCC Current Progress Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1f2937;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #586069;
    --red: #f85149;
    --red-dim: #3d1a1a;
    --amber: #d29922;
    --green: #3fb950;
    --blue: #58a6ff;
    --cyan: #39d0d8;
    --purple: #bc8cff;
    --pink: #ff7eb6;
    --accent: #1f6feb;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; }

  .page {
    display: grid;
    grid-template-rows: auto auto auto 1fr;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg,#0d1117,#161b22);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items:center; justify-content:space-between;
  }
  .header-title { display:flex; align-items:center; gap:12px; }
  .header-badge {
    background:var(--accent); color:#fff; font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:5px; letter-spacing:1px; font-family:'DM Mono',monospace;
  }
  .header h1 { font-size:20px; font-weight:600; }
  .header-sub { color:var(--text-muted); font-size:12px; font-family:'DM Mono',monospace; }
  .live-dot { width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; display:inline-block; margin-right:6px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* STATS */
  .stats-bar {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding: 12px 24px;
    display:flex; align-items:center; justify-content:center; gap:0;
  }
  .stat-item { text-align:center; padding:0 32px; }
  .stat-num { font-size:30px; font-weight:700; font-family:'DM Mono',monospace; line-height:1; }
  .stat-label { font-size:10px; color:var(--text-muted); margin-top:4px; letter-spacing:.6px; text-transform:uppercase; }
  .stat-div { width:1px; height:38px; background:var(--border); }

  /* PATIENT HEADER */
  .pat-header {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:14px 24px; display:flex; align-items:center;
  }
  .pid-lbl { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:4px; }
  .pid-val { font-family:'DM Mono',monospace; font-size:22px; font-weight:600; color:var(--blue); }
  .tags { margin-left:auto; display:flex; gap:10px; align-items:center; }
  .tag {
    padding:5px 14px; border-radius:5px; font-size:12px;
    font-family:'DM Mono',monospace; border:1px solid var(--border);
    background:var(--surface2); color:var(--text-muted);
  }
  .tag.danger { background:var(--red-dim); color:var(--red); border-color:#5a1d1d; }

  /* CARDS */
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
    overflow: hidden;
  }
  .card {
    border:1px solid var(--border); border-top:none;
    padding: 24px 32px;
    display:flex; flex-direction:column; overflow:hidden;
    background:var(--surface);
  }
  .card:first-child { border-right:none; }
  .card-title {
    font-size:12px; color:var(--text-muted); text-transform:uppercase;
    letter-spacing:.9px; font-weight:600; margin-bottom:0; flex-shrink:0;
  }

  /* GAUGE */
  .gauge-wrap {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  }
  .gauge-svg { width:min(240px, 40vh); height:auto; }
  .risk-pct { font-size:clamp(36px,5vw,56px); font-weight:700; font-family:'DM Mono',monospace; line-height:1; }
  .risk-lbl { font-size:clamp(14px,2vw,20px); font-weight:600; margin-top:2px; }
  .risk-rec { font-size:clamp(11px,1.2vw,14px); color:var(--text-muted); font-style:italic; margin-top:6px; }

  /* SHAP */
  .shap-body { flex:1; display:flex; flex-direction:column; justify-content:space-between; min-height:0; }
  .shap-legend { display:flex; gap:12px; flex-wrap:wrap; margin:12px 0; }
  .leg-item { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-muted); }
  .leg-dot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
  .shap-bars { display:flex; flex-direction:column; gap:0; flex:1; justify-content:space-evenly; }
  .shap-row { display:flex; align-items:center; gap:10px; }
  .shap-lbl { width:150px; font-size:13px; font-family:'DM Mono',monospace; color:var(--text-muted); flex-shrink:0; text-align:right; }
  .bar-wrap { flex:1; height:22px; position:relative; display:flex; align-items:center; }
  .bar-zero { position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--border); }
  .bar { position:absolute; height:16px; border-radius:3px; transition:width .4s ease; }
  .bar.pos { left:50%; }
  .bar.neg { right:50%; }
  .shap-val { font-size:12px; font-family:'DM Mono',monospace; color:var(--text-dim); width:52px; flex-shrink:0; text-align:right; }
  .shap-axis { display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); font-family:'DM Mono',monospace; padding-left:160px; margin-top:6px; flex-shrink:0; }

  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation:fadeIn .3s ease; }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-title">
      <span class="header-badge">HNSCC</span>
      <h1>Clinical Decision Support Dashboard</h1>
    </div>
    <div class="header-sub"><span class="live-dot"></span>Recurrence Risk Prediction System &mdash; v2.1</div>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><div class="stat-num" style="color:var(--text)">692</div><div class="stat-label">Total Patients</div></div>
    <div class="stat-div"></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--red)">56</div><div class="stat-label">High Risk (&ge;70%)</div></div>
    <div class="stat-div"></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--amber)">599</div><div class="stat-label">Medium Risk</div></div>
    <div class="stat-div"></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--green)">37</div><div class="stat-label">Low Risk</div></div>
    <div class="stat-div"></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--purple)">160</div><div class="stat-label">Recurrence+</div></div>
  </div>

  <div class="pat-header" id="patHeader"></div>
  <div class="cards" id="cards"></div>

</div>
<script>
const P = {"id":"PT-2024-625","recurrence":"yes","risk":82.8,"nlr":10.11,"plr":357.83,"lmr":1.05,"age":69,"sex":0,"tstage":"TX","grading":1,"hpv":1,"ln_pos":14,"shap":{"nlr":{"value":10.11,"high":true,"contrib":0.171},"plr":{"value":357.83,"high":true,"contrib":0.068},"lmr":{"value":1.05,"high":false,"contrib":0.019},"age":{"value":69,"young":false,"contrib":-0.008},"tstage":{"value":"TX","contrib":0.064}}};

const rc = r => r>=70?'var(--red)':r>=40?'var(--amber)':'var(--green)';
const rl = r => r>=70?'High Risk':r>=40?'Medium Risk':'Low Risk';
const rr = r => r>=70?'⚠️ Intensive follow-up recommended.':r>=40?'📋 Standard monitoring protocol.':'✅ Routine follow-up sufficient.';

function gauge(risk){
  const R=90,cx=110,cy=110;
  const a = Math.PI+(risk/100)*Math.PI;
  const x2=cx+R*Math.cos(a), y2=cy+R*Math.sin(a);
  const col=risk>=70?'#f85149':risk>=40?'#d29922':'#3fb950';
  const bg =risk>=70?'#3d1a1a':risk>=40?'#2d2208':'#0f2d1a';
  return `<svg viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg" class="gauge-svg">
    <path d="M${cx-R} ${cy} A${R} ${R} 0 0 1 ${cx+R} ${cy}" fill="none" stroke="${bg}" stroke-width="14" stroke-linecap="round"/>
    <path d="M${cx-R} ${cy} A${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"/>
  </svg>`;
}

function shap(p){
  const s=p.shap;
  const rows=[
    {lbl:`NLR (${s.nlr.high?'High':'Normal'})`,   c:s.nlr.contrib,    col:'var(--cyan)'},
    {lbl:`T-Stage (${s.tstage.value})`,            c:s.tstage.contrib, col:'var(--blue)'},
    {lbl:`PLR (${s.plr.high?'High':'Normal'})`,   c:s.plr.contrib,    col:'#7ec8e3'},
    {lbl:`Age (${s.age.young?'Younger':'Older'})`,c:s.age.contrib,    col:'var(--purple)'},
    {lbl:`LMR (${s.lmr.high?'High':'Normal'})`,   c:s.lmr.contrib,    col:'var(--pink)'},
  ];
  const mx=Math.max(...rows.map(r=>Math.abs(r.c)),0.01);
  const sc=45/mx;
  return `
    <div class="shap-legend">
      ${rows.map(r=>`<span class="leg-item"><span class="leg-dot" style="background:${r.col}"></span>${r.lbl}</span>`).join('')}
    </div>
    <div class="shap-bars">
      ${rows.map(r=>{
        const pct=Math.abs(r.c)*sc, pos=r.c>=0;
        return `<div class="shap-row">
          <div class="shap-lbl">${r.lbl}</div>
          <div class="bar-wrap">
            <div class="bar-zero"></div>
            <div class="bar ${pos?'pos':'neg'}" style="width:${pct}%;background:${r.col}"></div>
          </div>
          <div class="shap-val">${r.c>0?'+':''}${r.c.toFixed(3)}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="shap-axis"><span>← Reduce</span><span>Increase →</span></div>`;
}

function render(p){
  const col=rc(p.risk), sex=p.sex===0?'Male':'Female', hpv=p.hpv===1?'Positive':p.hpv===0?'Negative':'Unknown';
  document.getElementById('patHeader').innerHTML=`
    <div>
      <div class="pid-lbl">Patient ID</div>
      <div class="pid-val">${p.id}</div>
    </div>
    <div class="tags">
      <span class="tag">${sex}</span>
      <span class="tag">HPV ${hpv}</span>
      <span class="tag ${p.recurrence==='yes'?'danger':''}">
        ${p.recurrence==='yes'?'⚠ Recurrence Confirmed':'✓ No Recurrence'}
      </span>
    </div>`;
  document.getElementById('cards').innerHTML=`
    <div class="card fade-in">
      <div class="card-title">Recurrence Risk Assessment</div>
      <div class="gauge-wrap">
        ${gauge(p.risk)}
        <div class="risk-pct" style="color:${col}">${p.risk}%</div>
        <div class="risk-lbl" style="color:${col}">${rl(p.risk)}</div>
        <div class="risk-rec">${rr(p.risk)}</div>
      </div>
    </div>
    <div class="card fade-in">
      <div class="card-title">SHAP Risk Attribution (Individual Level)</div>
      <div class="shap-body">${shap(p)}</div>
    </div>`;
}
render(P);
</script>
</body>
</html>
